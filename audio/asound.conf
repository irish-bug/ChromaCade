# ChromaCade -- system-wide default ALSA routing. Install to /etc/asound.conf
# (not ~/.asoundrc -- this needs to apply under chromacade.service, which runs
# as root/system, not a login shell with a resolvable $HOME). Verified live
# against plinkplonk's WM8960 Audio HAT 2026-08-19/20 -- see
# docs/device-rebuild-guide.md for the full setup (including a mixer-routing
# step this file alone does NOT cover -- the WM8960's internal
# "Output Mixer PCM" switches default off and silently produce zero audio
# despite this config being completely correct; that's a codec-level fix,
# not an ALSA-config one).
#
# dmix lets multiple processes (the main app, the boot chime) share the one
# hardware device without fighting over exclusive access; softvol gives a
# single "PCM" mixer control independent of whatever mixer controls the real
# codec exposes (the WM8960 alone has dozens -- Speaker, Headphone, Playback
# Volume, ALC*, etc.) -- amixer/alsamixer users should adjust "PCM", not any
# of the codec's own named controls, to change the default output's volume.
#
# ADAPTING THIS FOR A DIFFERENT DAC/AUDIO HAT:
#   1. Card name -- replace every "wm8960soundcard" below with your card's
#      actual name from `aplay -l` (e.g. "card 3: wm8960soundcard
#      [wm8960-soundcard], device 0: ..." -- the name is the bit in the first
#      brackets, not the number, since card *numbers* can shift across
#      reboots depending on what else is attached). This project deliberately
#      names by card name rather than index for exactly that reason -- see
#      docs/decision-log.md's ALSA-config entry (originally written for a
#      HiFiBerry DAC on unit #1, "sndrpihifiberry", same convention).
#   2. Sample rate/channels (44100/2 below) -- most HATs handle standard
#      44.1kHz stereo fine via dmix's own resampling either way, but a
#      DAC with a fixed native rate (some HiFiBerry variants only do 48000,
#      for instance) may sound better set to match it exactly instead of
#      relying on dmix to convert.
#   3. period_size/buffer_size (1024/8192) -- latency/stability tuning, not
#      hardware-specific in principle, but a different DAC's own driver may
#      have different constraints on what period sizes it accepts; if
#      `speaker-test` errors out on "period size" specifically, this is
#      what to adjust first.
#   4. The mixer-routing step mentioned above (amixer sset ... on) is
#      WM8960-specific -- a different codec may not need it at all, or may
#      need a differently-named equivalent control. Check
#      `amixer -c <cardname> scontrols` for anything that looks like an
#      output-routing switch (not just a volume control) if audio is
#      silent despite this file being correct and `aplay -l` showing the
#      card.

pcm.wm8960hw {
    type hw
    card wm8960soundcard
}

pcm.dmixer {
    type dmix
    ipc_key 1024
    ipc_perm 0666
    slave {
        pcm "wm8960hw"
        period_time 0
        period_size 1024
        buffer_size 8192
        rate 44100
        channels 2
    }
}

ctl.dmixer {
    type hw
    card wm8960soundcard
}

pcm.softvol {
    type softvol
    slave.pcm "dmixer"
    control.name "PCM"
    control.card wm8960soundcard
}

ctl.softvol {
    type hw
    card wm8960soundcard
}

pcm.!default {
    type plug
    slave.pcm "softvol"
}

ctl.!default {
    type hw
    card wm8960soundcard
}
